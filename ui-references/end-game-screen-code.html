<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .dice-pattern {
            background-color: #f9fbee;
            background-image: radial-gradient(#edefe2 1.5px, transparent 1.5px), radial-gradient(#edefe2 1.5px, #f9fbee 1.5px);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            opacity: 0.4;
        }

    body {
      min-height: max(884px, 100dvh);

<body class="bg-background font-body text-on-background min-h-screen flex flex-col relative overflow-hidden">
<!-- Subtle Background Motif -->
<div class="absolute inset-0 dice-pattern pointer-events-none"></div>
<!-- Top App Bar (Shared Component) -->
<header class="z-10 bg-[#f9fbee] dark:bg-stone-950 flex justify-between items-center px-6 py-4 w-full max-w-none">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[#3e4324] dark:text-[#e1e4d7]">menu</span>
<h1 class="font-headline font-bold text-xl tracking-tight text-[#3e4324] dark:text-[#f9fbee]">Dice Poker</h1>
</div>
<div class="flex gap-2">
<!-- Navigation Logic Placeholder -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-6 relative z-10 -mt-12">
<!-- Game Over Section -->
<div class="w-full max-w-sm flex flex-col items-center text-center">
<!-- Icon/Visual Anchor -->
<div class="mb-6 bg-surface-container-high p-6 rounded-full inline-flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-5xl" style="font-variation-settings: 'FILL' 1;">casino</span>
</div>
<h2 class="font-headline font-extrabold text-5xl text-primary tracking-tighter mb-2">Game Over</h2>
<p class="font-label text-on-surface-variant uppercase tracking-[0.2em] text-xs mb-8">The house always wins, but you did well.</p>
<!-- Score Display Bento-style Card -->
<div class="bg-surface-container-lowest w-full p-8 rounded-xl shadow-[0_20px_40px_rgba(62,67,36,0.04)] mb-10 relative overflow-hidden">
<div class="flex flex-col items-center">
<div class="flex items-center gap-3 mb-1">
<span class="font-label text-on-surface-variant text-[11px] font-medium uppercase tracking-widest">Total Score</span>
<span class="bg-secondary text-on-secondary font-label text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">NEW HIGHSCORE</span>
</div>
<div class="font-headline font-extrabold text-7xl text-primary tracking-tighter">2450</div>
</div>
<!-- Graphic Accents -->
<div class="absolute -bottom-4 -right-4 opacity-5 rotate-12">
<span class="material-symbols-outlined text-[120px]">playing_cards</span>
</div>
</div>
<!-- Action Cluster -->
<div class="grid grid-cols-1 gap-4 w-full">
<!-- Primary CTA -->
<button class="bg-secondary text-on-secondary font-headline font-semibold py-4 rounded-xl shadow-[inset_0_2px_0_rgba(255,255,255,0.2)] hover:opacity-90 transition-all flex items-center justify-center gap-2 group">
<span class="material-symbols-outlined text-xl">refresh</span>
                    New Game
                </button>
<!-- Secondary CTA -->
<button class="bg-primary-container text-on-primary font-headline font-semibold py-4 rounded-xl hover:opacity-90 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-xl">leaderboard</span>
                    High Scores
                </button>
</div>
</div>
</main>
<!-- Bottom Navigation (Shared Component) -->
<!-- Determined active: Scores maps logically as the game just ended and the user likely wants to see rankings -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-6 pt-3 bg-[#f9fbee]/80 dark:bg-stone-950/80 backdrop-blur-xl border-t border-[#47473e]/10 shadow-[0_-4px_20px_rgba(62,67,36,0.05)] z-50 rounded-t-2xl">
<!-- Play Tab (Inactive) -->
<a class="flex flex-col items-center justify-center text-[#47473e] dark:text-stone-400 px-5 py-1.5 hover:text-[#3e4324] dark:hover:text-[#f9fbee]" href="#">
<span class="material-symbols-outlined mb-1">style</span>
<span class="text-[11px] font-medium font-label uppercase tracking-wider">Play</span>
</a>
<!-- Scores Tab (Active) -->
<a class="flex flex-col items-center justify-center bg-[#e1e6bb] dark:bg-[#3e4324] text-[#191e04] dark:text-[#f9fbee] rounded-xl px-5 py-1.5 scale-95 transition-transform duration-200" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">leaderboard</span>
<span class="text-[11px] font-medium font-label uppercase tracking-wider">Scores</span>
</a>
<!-- Rules Tab (Inactive) -->
<a class="flex flex-col items-center justify-center text-[#47473e] dark:text-stone-400 px-5 py-1.5 hover:text-[#3e4324] dark:hover:text-[#f9fbee]" href="#">
<span class="material-symbols-outlined mb-1">menu_book</span>
<span class="text-[11px] font-medium font-label uppercase tracking-wider">Rules</span>
</a>
</nav>
<!-- Decorative Corner Dice (Bottom Left) -->
<div class="absolute bottom-24 -left-8 opacity-10 pointer-events-none transform -rotate-12">
<span class="material-symbols-outlined text-[180px] text-primary">casino</span>
</div>
